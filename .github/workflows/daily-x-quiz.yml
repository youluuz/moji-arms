name: Publish daily Moji Arms X quiz

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Tokyo'
  pull_request:
    paths:
      - 'scripts/daily_x_quiz.py'
      - '.github/workflows/daily-x-quiz.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or publish now to X'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - check-connection
          - publish

permissions:
  contents: read

concurrency:
  group: moji-arms-x-quiz
  cancel-in-progress: false

jobs:
  post-quiz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish previous answer and today's question
        run: |
          if [ "${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}" = "true" ]; then
            python scripts/daily_x_quiz.py --publish
          elif [ "${{ inputs.mode == 'check-connection' }}" = "true" ]; then
            python scripts/daily_x_quiz.py --check-connection
          else
            python scripts/daily_x_quiz.py
          fi

  verify-no-post:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate quiz generation without posting
        run: python scripts/daily_x_quiz.py
      - name: Validate Buffer connection without posting
        run: python scripts/daily_x_quiz.py --check-connection
