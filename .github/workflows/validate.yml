name: Check all battle modes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go race-free rules and regression suite
        run: go test ./... -count=1 -v
      - name: Go source static analysis
        run: go vet ./...
      - name: JavaScript parser checks
        run: |
          node --check public/glyph_random.js
          node --check public/ultimate-core.js
          node --check public/ultimate-cpu.js
          node --check public/ultimate-multi.js
          node --check public/roman-effects-v97.js
          node --check public/mobile-stick-dock-v100.js
          node --check public/launch-nav.js
          node --check public/room-entry-v106.js
          node --check public/emoji-shuffle-v107.js
          node --check public/mode-separation-v109.js
          node --check public/glyph-book-v114.js
          node --check public/owner-cyber-v114.js
          node --check public/room-guide-locker-v113.js
          node --check public/room-tools-v113.js
          node -e "const a=require('./public/notices.json');if(!Array.isArray(a.notices)||!a.notices.length)process.exit(1)"
          node --check scripts/public-release-check.mjs
          node --check public/mobile-input-v70.js
          node tests/input-safety.cjs
          node tests/public-pages.cjs
          node --check public/arena-expansion-v72.js
          node tests/check-html-scripts.cjs
      - name: Build the Render binary
        run: CGO_ENABLED=0 go build -o /tmp/mojiarms .

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use hosted Linux Chrome for browser smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Start the local real game server
        run: |
          go build -o /tmp/mojiarms .
          /tmp/mojiarms --no-browser --port 8083 > /tmp/mojiarms.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8083/healthz && exit 0
            sleep 1
          done
          cat /tmp/mojiarms.log
          exit 1
      - name: Run Android-size, landscape and shared-mode browser smoke
        run: node tests/browser-smoke.cjs
      - name: Test real two-player online normal and custom matches
        run: node tests/browser-pvp.cjs
      - name: Audit native desktop CPU spectator controls at three window sizes
        run: node tests/browser-desktop-spectator.cjs
      - name: Verify room creation and invite from empty login equipment
        run: node tests/browser-room-invite.cjs
      - name: Test glyph encyclopedia, copy, personal backup and hidden cyber FX
        run: node tests/browser-glyph-book.cjs
      - name: Test five-slot emoji-only random in normal and custom CPU lobbies
        run: node tests/browser-emoji-shuffle.cjs
      - name: Test embedded online match in mobile portrait and landscape
        run: node tests/browser-embedded-pvp.cjs
      - name: Check public-beta deployment paths and WebSocket on test server
        run: node scripts/public-release-check.mjs http://127.0.0.1:8083
